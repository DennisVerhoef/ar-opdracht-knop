<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Opdracht-knop</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      min-height: 100vh;
      margin: 0;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .kaart {
      max-width: 420px;
      background: #1e293b;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .vink { font-size: 48px; margin-bottom: 8px; }
    p { line-height: 1.5; color: #94a3b8; font-size: 15px; }
    .adres {
      margin-top: 20px;
      padding: 12px;
      background: #0f172a;
      border-radius: 10px;
      font-size: 13px;
      color: #38bdf8;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="kaart">
    <div class="vink">✅</div>
    <h1>De hosting werkt!</h1>
    <p>
      Als je deze pagina op je telefoon ziet, staat je webadres online en klaar.
      Dit is nog een testpagina — het echte opnameknopje komt hier straks te staan.
    </p>
    <p>Kopieer het adres uit de adresbalk van je browser en stuur het door.</p>
    <div class="adres" id="adres"></div>
  </div>
  <script>
    document.getElementById('adres').textContent = window.location.href;
  </script>
</body>
</html>
